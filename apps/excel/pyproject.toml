[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-toolkit-xl"
version = "0.1.0"  # lockstep with VERSION; bin/bump_version.py rewrites every portion
description = "Excel add-in (xlwings) for quant-toolkit: worksheet functions over the pricing layer."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "quant-toolkit-finance==0.1.0",
    "xlwings>=0.30",
    "pywin32; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_toolkit.xl", "quant_toolkit.xl.*"]
namespaces = true
