[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-toolkit"
version = "0.1.0"
description = "A data science project for financial pricing instruments, rate products."
authors = [{name = "Carlos Garay", email = "cagaray13@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pytest",
    "pytest-cov",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
keywords = ["finance", "pricing", "rates", "quant", "data-science"]

[project.urls]
"Homepage" = "https://github.com/rudetastic13/rates-pricing"
"Repository" = "https://github.com/rudetastic13/rates-pricing"
"Bug Tracker" = "https://github.com/rudetastic13/rates-pricing/issues"
"Changelog" = "https://github.com/rudetastic13/rates-pricing/CHANGELOG.md"


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.12",
    "mypy>=1.9",
    "black>=24.0",
    "hypothesis>=6.0",
    "coverage>=7.0",
    "pytest-ruff",
]
# Excel add-in adapter (quant_toolkit_xl). xlwings only drives Excel on Windows/macOS;
# on Linux it imports but cannot connect, so this is intentionally an opt-in extra and
# belongs in the Windows trader bundle, not the WSL/CI env.
excel = [
    "xlwings>=0.30",
]
# toolchain for the finance._core C++ extensions (built via bin/build_core.sh);
# pybind11 3.x is the line with CPython 3.14 support
cpp = [
    "pybind11>=3.0",
    "cmake>=3.26",
    "ninja",
]
# optional jitted kernels (finance.dates.schedules.numba_based degrades without it)
accel = [
    "numba>=0.64",
]


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include=[
    "finance",
    "finance.*",
    "common",
    "common.*",
    "quant_toolkit",
    "quant_toolkit.*",
    "quant_toolkit_xl",
    "quant_toolkit_xl.*",
]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=[
    "src/finance/tests",
    "src/common/tests",
    "src/quant_toolkit_xl/tests",
]
addopts = [
    "--cov=finance", # measure coverage for finance package
    "--cov=common", # measure coverage for common package
    "--cov-report=html:./pytest-reports/cov-reports", # generate HTML coverage report
    #"--junitxml=./pytest-reports/junit.xml", # generate JUnit XML report
]
markers = [
    # types
    "unit: mark for unit test",
    "hypothesis: mark for hypothesis test",
    "datemath: mark test for date math",
    "market_data: mark test for market data",
    "instruments: mark test for instruments",
    "risk: market test for risk analytics",
    "performance: performance tests",
    "integration: mark for integration tests",
    "regression: mark for regression tests",

    # Groups
    "calculators: tests for pricing calculators",
    "calibration: tests for model calibration",

    # others
    "slow: slow tests",
]

[tool.coverage.run]
branch = true
omit = [
    "*/tests/*",
    "\\tests\\*",
    "*/data/*",
    "*\\data\\*",
    "*/finance/_core/*",
    "*\\finance\\_core\\*",
    "setup.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = [
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
# linting config (used when ruff is installed as a dev dependency)
include = ["src/**/*.py"]
exclude = ["build", "dist", ".venv", ".eggs"]
line-length = 120
indent-width = 4
target-version = "py311"
# enable pyflakes 'F' and subset of pycodestyle 'E' by default
select = ["E4", "E7", "E9", "F"]
ignore = []

# allow anything to be fixed when ruff --fix
fixable=["ALL"]
unfixable=[]


# allow unsued varaibles when underscore-prefixed
dummy-variable-rgx="^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style="double"
indent-style="space"
skip-magic-trailing-comma=false
line-ending="auto"
docstring-code-format=false
docstring-code-line-length="dynamic"
