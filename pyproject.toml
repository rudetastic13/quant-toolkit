[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Meta-package: installs the library portions; all tool config (pytest, coverage, ruff) lives here.
# Library:  pip install quant-toolkit    (common + finance)
# The Excel add-in (apps/excel) is standalone: install it separately so Windows-only tooling never touches this env.
[project]
name = "quant-toolkit"
version = "0.1.0"  # lockstep with VERSION; bin/bump_version.py rewrites every portion
description = "A data science project for financial pricing instruments, rate products."
authors = [{name = "Carlos Garay", email = "cagaray13@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quant-toolkit-common==0.1.0",
    "quant-toolkit-finance==0.1.0",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
keywords = ["finance", "pricing", "rates", "quant", "data-science"]

[project.urls]
"Homepage" = "https://github.com/rudetastic13/rates-pricing"
"Repository" = "https://github.com/rudetastic13/rates-pricing"
"Bug Tracker" = "https://github.com/rudetastic13/rates-pricing/issues"
"Changelog" = "https://github.com/rudetastic13/rates-pricing/CHANGELOG.md"


[project.optional-dependencies]
# optional jitted kernels and the Numba engine (finance degrades without it)
accel = ["numba>=0.64"]
# validation oracles for the engines (JAX today; QuantLib may join)
oracle = ["jax", "jaxlib"]
# toolchain for the finance._core C++ extension (bin/bash/build_core.sh, bin/powershell/build_core.ps1); pybind11 3.x supports CPython 3.14
cpp = ["pybind11>=3.0", "cmake>=3.26", "ninja"]
# what the test suite needs (common.testing uses pandas + tabulate for its markdown helpers)
test = ["pytest", "pytest-cov", "hypothesis", "pandas", "tabulate"]
notebook = ["ipykernel", "matplotlib"]
dev = ["pytest", "pytest-cov", "hypothesis", "pandas", "tabulate", "ruff"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = [
    "packages/common/src/quant_toolkit/common/tests",
    "packages/finance/src/quant_toolkit/finance/tests",
]
# the portions share the quant_toolkit namespace (no __init__.py); importlib mode + this keep test modules
# under their real dotted names, so importing one from another module does not execute it twice
consider_namespace_packages = true
addopts = [
    "--import-mode=importlib",
    "--cov=quant_toolkit", # coverage over every installed portion
    "--cov-report=html:./pytest-reports/cov-reports", # generate HTML coverage report
    #"--junitxml=./pytest-reports/junit.xml", # generate JUnit XML report
]
markers = [
    # types
    "unit: mark for unit test",
    "hypothesis: mark for hypothesis test",
    "datemath: mark test for date math",
    "risk: market test for risk analytics",
    "performance: performance tests",
    "integration: mark for integration tests",
    "regression: mark for regression tests",

    # Groups
    "calibration: tests for model calibration",
]

[tool.coverage.run]
branch = true
source = ["quant_toolkit"]
omit = [
    "*/quant_toolkit/*/tests/*",
    "*\\quant_toolkit\\*\\tests\\*",
    "*/quant_toolkit/finance/_core/*",
    "*\\quant_toolkit\\finance\\_core\\*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = [
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
# linting config (used when ruff is installed as a dev dependency)
include = ["packages/**/*.py"]
exclude = ["build", "dist", ".venv", ".eggs"]
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# enable pyflakes 'F' and subset of pycodestyle 'E' by default
select = ["E4", "E7", "E9", "F"]
ignore = []
# allow anything to be fixed when ruff --fix
fixable = ["ALL"]
unfixable = []
# allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style="double"
indent-style="space"
skip-magic-trailing-comma=false
line-ending="auto"
docstring-code-format=false
docstring-code-line-length="dynamic"
